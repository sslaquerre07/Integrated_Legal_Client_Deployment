name: Terraform CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths: [ "**.tf" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  Terraform:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
    - id: 'auth'
      name: 'Authenticate to GCP'
      uses: google-github-actions/auth@v2
      with:
          create_credentials_file: 'true'
          workload_identity_provider: 'projects/1016575016586/locations/global/workloadIdentityPools/cicd-pool/providers/github-provider'
          service_account: 'cicd-service-account@integrated-legal-client-portal.iam.gserviceaccount.com'
    - name: Terraform Format
      run: terraform fmt -check
      working-directory: terraform
    - name: Terraform Init
      run: terraform init
      working-directory: terraform
    - name: Terraform Validate
      run: terraform validate
      working-directory: terraform
    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -input=false
      env:
        TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      working-directory: terraform
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
      env:
        TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      working-directory: terraform
